- name: To install nginx
  hosts: web
  vars_prompt:
  - name: course
    prompt: "Please enter the course name"
    private: false
  - name: duration
    prompt: "Please enter the course name"
    private: true
  become: yes
  tasks:
  - name: To install nginx
    ansible.builtin.debug:
     msg: "Hi, i am learning {{course}}"


  - name: To start nginx
    ansible.builtin.debug:
     msg: "And its duration is {{duration}}"

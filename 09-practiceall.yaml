- name: Installing nginx
  hosts: web
  gather_facts: no
  become: yes
  tasks:
  - name: Installing nginx
    ansible.builtin.package:
      name: nginx
      state: present

- name: Installing nginx
  hosts: web
  gather_facts: no
  become: yes
  tasks:
  - name: Installing nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes

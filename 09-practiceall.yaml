- name: To create ec2 instances and r53 records
  hosts: web
  vars:
   subnet_id: "subnet-0e5b4edb84c2a3ac3"
   sg_id: "sg-0e5ba734fc4082212"
   ami_id: "ami-09c813fb71547fc4f"
   zone: "app789.site"
   instances:
   - mysql
   - backend
   - frontend
  tasks:
  - name: To install boto3 and botocore
    ansible.builtin.pip:
      name:
      - boto3
      - botocore
      executable: pip3.9
  - name: To create instances
    amazon.aws.ec2_instace:
     name: "{{item}}"
     instance_type: "t3.micro"
     vpc_subnet_id: "{{subnet_id}}"
     security_group: "{{sg_id}}"
     ami_id: "{{ami_id}}"
    loop: "{{instances}}"
    register: ec2_instances
  - name: To print the instances
    ansible.builtin.debug:
      msg: "{{ec2_instances}}"
  #private IP R53
  - name: create r53 private records
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ item.item }}.{{ zone }}" #mysql.daws81s.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
      overwrite: true
    loop: "{{ ec2_instances.results }}"

  - name: create r53 public record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ zone }}" #daws81s.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: true
      overwrite: true
    loop: "{{ ec2_instances.results }}"
    when: item.item == "frontend" #when keyword should not have {{}}

- name: To install nginx
  hosts: web
  vars:
   course: "devops"
   duration: "120 hrs"
  become: yes
  tasks:
  - name: To install nginx
    ansible.builtin.debug:
     msg: "Hi, i am learning {{course}}"


  - name: To start nginx
    ansible.builtin.debug:
     msg: "And its duration is {{duration}}"

